services:
  downloader-mcp:
    image: ghcr.io/carldog/downloader-mcp:latest
    pull_policy: always
    container_name: downloader-mcp
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3003}:3000"
    # Enables `host.docker.internal` from inside the container, so URLs
    # pointing at same-host services (SAB, qBit running on the Docker
    # host) resolve via the Docker bridge gateway. Harmless when the
    # URLs point elsewhere (cloud, another host).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MCP_PORT: "3000"
      # Recommended: enable DNS-rebinding protection by listing the
      # host[:port] values clients actually use to reach this server
      # (Host header validation). Unset = protection off (warned at start).
      # MCP_ALLOWED_HOSTS: "192.168.1.50:3003,host.docker.internal:3003"
      SABNZBD_URL: "${SABNZBD_URL:-}"
      SABNZBD_API_KEY: "${SABNZBD_API_KEY:-}"
      QBITTORRENT_URL: "${QBITTORRENT_URL:-}"
      QBITTORRENT_USERNAME: "${QBITTORRENT_USERNAME:-}"
      QBITTORRENT_PASSWORD: "${QBITTORRENT_PASSWORD:-}"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
