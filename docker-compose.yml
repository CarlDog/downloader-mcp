services:
  downloader-mcp:
    image: ghcr.io/carldog/downloader-mcp:latest
    pull_policy: always
    container_name: downloader-mcp
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "${HOST_PORT:-3003}:3000"
    # Enables `host.docker.internal` from inside the container, so URLs
    # pointing at same-host services (SAB, qBit running on the Docker
    # host) resolve via the Docker bridge gateway. Harmless when the
    # URLs point elsewhere (cloud, another host).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MCP_PORT: "3000"
      # Required for HTTP deployments: bearer auth protects /mcp while
      # /health remains open for the container healthcheck.
      MCP_AUTH_TOKEN: "${MCP_AUTH_TOKEN:?set MCP_AUTH_TOKEN}"
      # Required for HTTP deployments: comma-separated bare hostnames clients
      # use to reach this server (Host header validation, port-independent).
      # Fleet-canonical value: localhost,127.0.0.1,[::1],your-nas,
      # host.docker.internal. A host:port entry also still matches (the port
      # is ignored) for compatibility with an old-style deployed value.
      MCP_ALLOWED_HOSTS: "${MCP_ALLOWED_HOSTS:?set MCP_ALLOWED_HOSTS}"
      # Idle-session eviction threshold (default 30 min). Was a bare constant
      # in source with nothing for compose to expose (docker-deployments.md
      # §10); now env-tunable from Portainer without a rebuild.
      MCP_SESSION_IDLE_MS: "${MCP_SESSION_IDLE_MS:-1800000}"
      MCP_RATE_LIMIT_MAX_REQUESTS: "${MCP_RATE_LIMIT_MAX_REQUESTS:-60}"
      SABNZBD_URL: "${SABNZBD_URL:-}"
      SABNZBD_API_KEY: "${SABNZBD_API_KEY:-}"
      QBITTORRENT_URL: "${QBITTORRENT_URL:-}"
      QBITTORRENT_API_KEY: "${QBITTORRENT_API_KEY:-}"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
